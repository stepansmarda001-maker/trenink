<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17408a">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Trénink">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png">
<title>Tréninkový plán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: pitch-coloured header band with week stats, 7-day strip, then the selected day as a numbered drill sheet. */
:root{
  --bg:#eef2f8; --surface:#fafcff; --ink:#0f1f38; --muted:#56657d; --line:#d3dbe8;
  --bib:#2f6fe4; --bib-ink:#ffffff; --flash:#a9ccff; --ok:#2563c9; --danger:#b3321f; --focus:#1d4fb0;
  --pitch:#17408a; --pitch-2:#143877; --chalk:#f2f6fc;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1424; --surface:#111f36; --ink:#e6edf8; --muted:#8ea1bf; --line:#243653;
    --bib:#5b97ff; --bib-ink:#06142e; --flash:#c4dcff; --ok:#6aa6ff; --danger:#ff7a63; --focus:#8db8ff;
    --pitch:#0f2a58; --pitch-2:#0c2349; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1424; --surface:#111f36; --ink:#e6edf8; --muted:#8ea1bf; --line:#243653;
  --bib:#5b97ff; --bib-ink:#06142e; --flash:#c4dcff; --ok:#6aa6ff; --danger:#ff7a63; --focus:#8db8ff;
  --pitch:#0f2a58; --pitch-2:#0c2349; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0;text-wrap:balance}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* Header band */
.band{
  background:
    repeating-linear-gradient(90deg,var(--pitch) 0 64px,var(--pitch-2) 64px 128px);
  color:var(--chalk);position:relative;overflow:hidden;border-bottom:4px solid var(--bib);
}
.band::before{ /* centre circle and halfway line */
  content:"";position:absolute;right:-70px;top:50%;width:260px;height:260px;margin-top:-130px;
  border:3px solid rgba(244,246,238,.28);border-radius:50%;pointer-events:none;
}
.band::after{content:"";position:absolute;right:59px;top:0;bottom:0;width:3px;background:rgba(244,246,238,.28);pointer-events:none}
.band .wrap{position:relative;z-index:1;padding-top:22px;padding-bottom:20px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.title h1{font:700 clamp(38px,8vw,60px)/.95 var(--display);letter-spacing:.01em;text-transform:uppercase}
.title .range{margin-top:6px;font-size:15px;opacity:.88;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:22px;padding-right:96px}
.stat b{display:block;font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
@media (max-width:640px){.stats{padding-right:0}.band::before,.band::after{opacity:.5}}

/* Toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:14px 0 10px}
.bar .grp{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--bib);color:var(--bib-ink);border-color:var(--bib)}
.btn.primary:hover{filter:brightness(.95);border-color:var(--bib)}
.btn.danger{color:var(--danger)}
.btn svg{width:16px;height:16px}
.save{font-size:13px;color:var(--muted)}

/* Week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{
  border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px 8px;
  text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0;position:relative
}
.day .dn{font:600 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day .dd{font:700 26px/1.05 var(--display);font-variant-numeric:tabular-nums}
.day .dm{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.day .bar-mini{width:70%;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.day .bar-mini i{display:block;height:100%;background:var(--ok)}
.day.sel{border-color:var(--ink);box-shadow:inset 0 -4px 0 var(--bib)}
.day.today .dd::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bib);margin-left:3px;vertical-align:super}
.day.restday .dm{font-style:italic}

/* Day panel */
.panel{margin:16px 0 8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.ph{padding:16px 18px 14px;border-bottom:1.5px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:center}
.ph h2{font:700 30px/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.ph .sub{color:var(--muted);font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .25s}
.acts{display:flex;gap:8px;flex-wrap:wrap}

.list{list-style:none;margin:0;padding:0;counter-reset:n}
.ex{
  display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center;
  padding:14px 18px;border-bottom:1px solid var(--line);counter-increment:n
}
.ex:last-child{border-bottom:0}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;color:transparent}
.chk svg{width:18px;height:18px}
.ex.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.ex-name{font-weight:700;font-size:17px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ex-name::before{content:counter(n,decimal-leading-zero);font:600 15px var(--display);color:var(--muted);letter-spacing:.06em}
.ex.done .ex-name span{text-decoration:line-through;color:var(--muted)}
.ex-meta{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ex-meta .spec{color:var(--ink);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:1px 9px 1px 7px}
.chip i{width:8px;height:8px;border-radius:50%}
.ex-note{font-size:14px;color:var(--muted);margin-top:4px}
.ex-time{font:700 26px/1 var(--display);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ex-time small{font:600 13px var(--body);color:var(--muted);margin-left:2px}
.ex-tools{grid-column:2 / 4;display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.ib{width:36px;height:36px;border-radius:8px;border:1.5px solid transparent;background:transparent;display:grid;place-items:center;padding:0;color:var(--muted)}
.ib:hover{border-color:var(--line);color:var(--ink);background:var(--bg)}
.ib svg{width:18px;height:18px}
.ib.run{color:var(--ink)}
@media (min-width:720px){
  .ex{grid-template-columns:auto 1fr auto auto}
  .ex-tools{grid-column:auto}
}

.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 22px var(--display);text-transform:uppercase;margin-bottom:4px}

/* Library */
.lib{padding:16px 18px 18px;border-top:1.5px solid var(--line);background:var(--bg)}
.m-p{background:#4a6fd8}.m-d{background:#14a3b8}
.fams{list-style:none;margin:0;padding:0}
.fam{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.fam:first-child{border-top:0}
.fb{flex:1;min-width:0}
.fb small{color:var(--muted);font-size:13px}
.fbar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 4px}
.fbar i{display:block;height:100%;background:linear-gradient(90deg,#2f7de1,#1fa37a);border-radius:5px}
.tiers{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tp{font:700 12px var(--display);color:#fff;border-radius:99px;padding:2px 9px;font-variant-numeric:tabular-nums}
.tp.off{background:var(--line);color:var(--muted)}
.srow .medal{width:34px;height:34px}.srow .medal svg{width:17px;height:17px}
[hidden]{display:none!important}
.goals,.shop{list-style:none;margin:0;padding:0}
.goal,.shopi{padding:12px 0;border-top:1px solid var(--line)}
.goal:first-child,.shopi:first-child{border-top:0}
.gh{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.gh b{flex:1;min-width:0}
.goal small{color:var(--muted);font-size:13px}
.okchip{background:#e6f6ee;color:#0c6b44;font:600 12px var(--display);letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:2px 10px}
.goal.done .fbar i{background:#1fa37a}
.cost{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.subh{font:700 15px var(--display);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 4px}
.gchart{border-top:1px solid var(--line);padding:12px 0}
.gc-h{display:flex;justify-content:space-between;align-items:baseline}
.gc-v{font:700 24px var(--display);font-variant-numeric:tabular-nums}
.gchart small{color:var(--muted);font-size:13px}
.lc{width:100%;height:auto;display:block;margin-top:4px}
.lc .lg{stroke:var(--line);stroke-width:1}
.lc .lt{fill:var(--muted);font:12px system-ui,sans-serif}
.lc .ll{fill:var(--ink);font:700 13px system-ui,sans-serif}
.lc circle[data-tip]:focus{outline:none;stroke:#0f1b2d;stroke-width:2}
.ctip{position:fixed;z-index:200;background:#0f1b2d;color:#fff;font-size:13px;padding:5px 9px;border-radius:7px;pointer-events:none;white-space:nowrap}
.sickbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff4e5;border:1.5px solid #f0c27a;color:#7a3e00;border-radius:10px;padding:8px 12px;margin:10px 0}
.medal{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.medal svg{width:20px;height:20px}
.m-b{background:#c47a3a}.m-s{background:#8f9bb0}.m-g{background:#e0a800}
.medal.off{background:var(--line);color:var(--muted);box-shadow:none}
.gsbox{margin:14px 0 6px;padding-top:12px;border-top:1px solid var(--line)}.gsbox h4{margin:0 0 6px;font-size:1rem}.gsbox .fld{display:block;margin:8px 0}.gsbox input{width:100%;box-sizing:border-box}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;margin-top:10px}.wall .w{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.68rem;line-height:1.15;color:var(--muted);padding:6px 2px;border-radius:10px}.wall .w.on{color:var(--ink,inherit);font-weight:600}.wall .medal{width:42px;height:42px}.wall .medal svg{width:22px;height:22px}.wall .w:focus-visible{outline:2px solid var(--blue,#2f7de1)}
.bdg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.bd{display:flex;gap:12px;align-items:center;justify-content:flex-start;text-align:left;padding:8px 0}
.bd small,.nb small{display:block;color:var(--muted);font-size:13px}
.bd.locked b{color:var(--muted)}
.xpbar{height:14px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#2f7de1,#1fa37a);border-radius:8px;transition:width .4s}
.lvname{font:700 22px var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.how{margin:0 0 8px;padding-left:20px;line-height:1.7}
.rbars{display:flex;align-items:flex-end;gap:6px;height:70px;margin:4px 0 6px}
.rb{flex:1;max-width:36px;background:#9db9e0;border-radius:4px 4px 0 0}
.rb.top{background:#e0a800}
.presets{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px}
.cele{position:relative;text-align:center;overflow:hidden;padding-top:6px}
.cele h3{font:700 26px var(--display);text-transform:uppercase;letter-spacing:.04em}
.xpbig{font:700 44px/1.1 var(--display);color:#2f7de1;margin:6px 0}
.lvup{margin:0 0 10px;font-size:17px}
.newb{display:grid;gap:8px;text-align:left;margin:10px 0}
.nb{display:flex;gap:12px;align-items:center}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:cf 1.9s ease-in forwards}
@keyframes cf{to{transform:translateY(420px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
.srows{list-style:none;margin:0;padding:0}
.srow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.srow .sd{flex:0 0 46px;font:700 15px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.srow .sm{flex:1;min-width:0}
.srow .sm small{color:var(--muted);font-size:13px;font-weight:500}
.srow .sn{display:flex;gap:10px;font-size:13px;color:var(--muted);white-space:nowrap}
.srow .sn b{font:700 18px var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.sbar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.sbar i{display:block;height:100%;background:#2f7de1;border-radius:3px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:baseline}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.lrow small{color:var(--muted);font-size:13px;font-weight:500}
.lrow .acts{flex-shrink:0}
.lrow .hint{margin:2px 0 0}
.lgrp{margin-top:14px}
.lgrp h3{font:700 16px var(--display);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.lgrp details summary{cursor:pointer;font-weight:600;padding:8px 0;color:var(--muted)}
.lib .chips button.mine{border-color:var(--accent,#2f7de1)}
.sw{border:0;padding:0;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw legend{font-size:13px;font-weight:600;margin-bottom:6px;padding:0}
.swl{position:relative;cursor:pointer}
.swl input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.swl span{display:block;width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.swl input:checked+span{border-color:var(--surface,#fff);box-shadow:0 0 0 3px var(--ink,#0f1b2d)}
.swl input:focus-visible+span{outline:3px solid #2f7de1;outline-offset:2px}
.lib h3{font:700 18px var(--display);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.lib .cat{margin-bottom:10px}
.lib .cat > span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-weight:600}
.lib .chips{display:flex;flex-wrap:wrap;gap:6px}
.lib .chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13.5px}
.lib .chips button:hover{border-color:var(--ink)}

.demo{margin:14px 0 0;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--bib) 22%,var(--surface));border:1.5px solid var(--bib);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:14px}
.foot{padding:12px 0 40px;color:var(--muted);font-size:13px}

/* Modal */
#modal,#runner{position:fixed;inset:0;display:none;z-index:20}
#modal.open{display:flex}
#runner.open{display:flex}
.scrim{position:absolute;inset:0;background:rgba(6,12,24,.6)}
.dlg{position:relative;margin:auto;width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border-radius:14px;padding:20px;border:1.5px solid var(--line)}
.dlg h3{font:700 26px/1 var(--display);text-transform:uppercase;margin-bottom:14px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label{font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%;min-height:42px}
.fld textarea{resize:vertical;min-height:80px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 10px}
@media (max-width:460px){.g4{grid-template-columns:1fr 1fr}}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:6px}
.dact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}

/* Groups, detail, gallery */
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
.fbtn{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 13px;font-size:13.5px;font-weight:600;display:inline-flex;gap:7px;align-items:center;min-height:34px}
.fbtn i{width:9px;height:9px;border-radius:50%}
.fbtn small{font-weight:500;opacity:.8;font-variant-numeric:tabular-nums;font-size:12.5px}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gbrk{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.detail{grid-column:1 / -1;border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;display:flex;flex-direction:column;gap:10px}
.detail p{max-width:68ch}
.detail .muted{color:var(--muted)}
.gal{display:flex;gap:8px;flex-wrap:wrap}
.gal button{padding:0;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);width:128px;height:96px}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.links{display:flex;gap:8px;flex-wrap:wrap}
a.btn{text-decoration:none;color:inherit}
a.btn.vid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fld input[type=file]{padding:8px}
.fimgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fimg{position:relative;width:92px;height:69px;border-radius:8px;overflow:hidden;border:1.5px solid var(--line)}
.fimg img{width:100%;height:100%;object-fit:cover;display:block}
.fimg button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;padding:0;font-size:16px;line-height:1}
.zoom{max-width:100%;max-height:68vh;display:block;margin:0 auto 12px;border-radius:8px}

.planner{padding:14px 18px 16px;border-bottom:1.5px solid var(--line);background:var(--bg)}
.pl-t{font:700 18px var(--display);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{position:relative;display:inline-flex}
.fchip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.fchip span{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 15px;font-weight:600;font-size:14.5px;min-height:40px}
.fchip i{width:10px;height:10px;border-radius:50%}
.fchip input:checked + span{background:var(--ink);color:var(--bg);border-color:var(--ink)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Team version ===== */

table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14.5px;min-width:560px}

/* ===== moderní vzhled: kompaktní hlavička, spodní navigace, animace ===== */

}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

<header class="band">

<script>
(function(){

/* ================= constants ================= */

/* ================= storage backends ================= */
function LocalBackendLS(){return LocalBackend()}
function idbOpen(){return new Promise(function(res,rej){
  if(!window.indexedDB){rej(new Error('bez IndexedDB'));return}
  var r;try{r=indexedDB.open('trenink',1)}catch(e){rej(e);return}
  r.onupgradeneeded=function(){r.result.createObjectStore('kv')};
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.onblocked=function(){rej(new Error('blokováno'))};
})}
function idbRun(db,fn){return new Promise(function(res,rej){
  var tx=db.transaction('kv','readwrite'),st=tx.objectStore('kv'),out=fn(st);
  tx.oncomplete=function(){res(out)};
  tx.onerror=function(){rej(tx.error)};
  tx.onabort=function(){var er=tx.error;rej(er&&er.name==='QuotaExceededError'?new Error('Paměť prohlížeče je plná'):(er||new Error('Uložení se nepovedlo')))};
})}
function idbAll(db){return new Promise(function(res,rej){
  var tx=db.transaction('kv','readonly'),st=tx.objectStore('kv'),k=st.getAllKeys(),v=st.getAll();
  tx.oncomplete=function(){var o={};k.result.forEach(function(key,i){o[key]=v.result[i]});res(o)};
  tx.onerror=function(){rej(tx.error)};
})}
async function openLocalBackend(){
  var KEY='trenink-local-v2',db;
  try{db=await idbOpen()}catch(e){return LocalBackendLS()}
  var store=await idbAll(db),subs=[];
  if(!Object.keys(store).length){
    var old=null;try{var r=localStorage.getItem(KEY);if(r)old=JSON.parse(r)}catch(e){}
    if(old&&Object.keys(old).length){
      try{await idbRun(db,function(st){Object.keys(old).forEach(function(k){st.put(old[k],k)})});store=old;try{localStorage.removeItem(KEY)}catch(e){}}
      catch(e){return LocalBackendLS()}
    }
  }
  function parent(p){return p.slice(0,p.lastIndexOf('/'))}
  function list(c){var out=[];Object.keys(store).forEach(function(p){if(parent(p)===c)out.push({id:p.slice(c.length+1),data:clone(store[p])})});return out}
  function notify(c){subs.slice().forEach(function(s){if(s.c===c)s.cb(list(c))})}
  var META='_sync/meta',meta=store[META];
  if(!meta||!meta.ts){meta={ts:{},tomb:{}};store[META]=meta}
  var onCh=null;function changed(){if(onCh)try{onCh()}catch(e){}}
  return {
    kind:'local',
    onChange:function(f){onCh=f},
    sub:function(c,cb){var s={c:c,cb:cb};subs.push(s);setTimeout(function(){cb(list(c))},0);return function(){subs=subs.filter(function(x){return x!==s})}},
    set:function(p,o){var prev=store[p],pt=meta.ts[p],ptb=meta.tomb[p];store[p]=clone(o);meta.ts[p]=Date.now();delete meta.tomb[p];notify(parent(p));
      return idbRun(db,function(st){st.put(store[p],p);st.put(meta,META)}).then(changed,function(e){
        if(prev===undefined)delete store[p];else store[p]=prev;
        if(pt===undefined)delete meta.ts[p];else meta.ts[p]=pt;if(ptb!==undefined)meta.tomb[p]=ptb;
        notify(parent(p));throw e})},
    del:function(p){delete store[p];delete meta.ts[p];meta.tomb[p]=Date.now();notify(parent(p));return idbRun(db,function(st){st.delete(p);st.put(meta,META)}).then(changed)},
    dump:function(){return clone(store)},
    replaceAll:function(data){var now=Date.now(),old=store,nm={ts:{},tomb:meta.tomb||{}};
      Object.keys(data).forEach(function(k){if(k!==META){nm.ts[k]=now;delete nm.tomb[k]}});
      Object.keys(old).forEach(function(k){if(k!==META&&!(k in data))nm.tomb[k]=now});
      var d2=clone(data);d2[META]=nm;
      return idbRun(db,function(st){st.clear();Object.keys(d2).forEach(function(k){st.put(d2[k],k)})})},
    /* synchronizace */
    syncState:function(){var d={},ts={},now=Date.now(),fixed=false,tomb={};
      Object.keys(store).forEach(function(k){if(k===META)return;d[k]=store[k];if(!meta.ts[k]){meta.ts[k]=now;fixed=true}ts[k]=meta.ts[k]});
      Object.keys(meta.tomb).forEach(function(k){if(now-meta.tomb[k]<90*864e5&&!(k in d))tomb[k]=meta.tomb[k]});
      if(fixed||Object.keys(tomb).length!==Object.keys(meta.tomb).length){meta.tomb=tomb;idbRun(db,function(st){st.put(meta,META)}).catch(function(){})}
      return {data:clone(d),ts:ts,tomb:clone(tomb)}},
    syncApply:function(ch){var par={};
      Object.keys(ch.put).forEach(function(k){store[k]=clone(ch.put[k].o);meta.ts[k]=ch.put[k].t;delete meta.tomb[k];par[parent(k)]=1});
      Object.keys(ch.del).forEach(function(k){if(k in store)par[parent(k)]=1;delete store[k];delete meta.ts[k];meta.tomb[k]=ch.del[k]});
      return idbRun(db,function(st){Object.keys(ch.put).forEach(function(k){st.put(store[k],k)});Object.keys(ch.del).forEach(function(k){st.delete(k)});st.put(meta,META)}).then(function(){Object.keys(par).forEach(notify)})}
  };
}
function LocalBackend(){
  var KEY='trenink-local-v2',store={},subs=[];
  try{var r=localStorage.getItem(KEY);if(r)store=JSON.parse(r)||{}}catch(e){}
  function parent(p){return p.slice(0,p.lastIndexOf('/'))}
  function list(c){var out=[];Object.keys(store).forEach(function(p){if(parent(p)===c)out.push({id:p.slice(c.length+1),data:clone(store[p])})});return out}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));return true}catch(e){return false}}
  function notify(c){subs.slice().forEach(function(s){if(s.c===c)s.cb(list(c))})}
  return {
    kind:'local',
    sub:function(c,cb){var s={c:c,cb:cb};subs.push(s);setTimeout(function(){cb(list(c))},0);return function(){subs=subs.filter(function(x){return x!==s})}},
    set:function(p,o){store[p]=clone(o);var ok=persist();notify(parent(p));return ok?Promise.resolve():Promise.reject(new Error('Paměť prohlížeče je plná'))},
    del:function(p){delete store[p];persist();notify(parent(p));return Promise.resolve()},
    dump:function(){return clone(store)},
    replaceAll:function(data){store=clone(data);return persist()?Promise.resolve():Promise.reject(new Error('Paměť prohlížeče je plná'))}
  };
}
function DbBackend(db){
  var q={};
  function enqueue(p,fn){var prev=q[p]||Promise.resolve();var n=prev.then(fn,fn);q[p]=n.catch(function(){});return n}
  return {
    kind:'db',
    sub:function(c,cb,err){
      return db.collection(c).onSnapshot(function(s){cb(s.docs.map(function(d){return {id:d.id,data:d.data()||{}}}))},function(e){if(err)err(e)});
    },
    set:function(p,o){var body=clone(o);return enqueue(p,function(){return db.doc(p).set(body)})},
    del:function(p){return enqueue(p,function(){return db.doc(p).delete()})}
  };
}

function listToMap(list){var m={};list.forEach(function(d){m[d.id]=d.data});return m}
function subscribe(name,path,assign){
  var u=B.sub(path,function(list){
    var m=listToMap(list),j=JSON.stringify(m);
    if(lastJson[name]===j)return;lastJson[name]=j;
    assign(clone(m));scheduleRender();
  },function(){status('Data se nepodařilo načíst');scheduleRender()});
  teamSubs.push(u);
}
function clearTeamSubs(){teamSubs.forEach(function(u){try{u()}catch(e){}});teamSubs=[]}
function selectTeam(tid){
  flush();clearTeamSubs();
  curTeam=tid||null;
  try{localStorage.setItem('trenink-team',curTeam||'')}catch(e){}
  D.players={};D.events={};D.plan={};D.att={};D.rate={};lastJson={};dirty={};undo=null;
  if(curTeam){
    var t='teams/'+curTeam;
    subscribe('players',t+'/players',function(m){D.players=m});
    subscribe('events',t+'/events',function(m){D.events=m});
    if(ROLE.coach){
      subscribe('plan','staff/'+curTeam+'/plan',function(m){D.plan=m});
      subscribe('att','staff/'+curTeam+'/att',function(m){D.att=m});
      subscribe('rate','staff/'+curTeam+'/rate',function(m){D.rate=m});
    }
  }
  scheduleRender();
}
function onTeams(list){
  var m=listToMap(list),j=JSON.stringify(m);
  teamsLoaded=true;
  if(!list.length&&B&&B.kind==='local'&&!window.__seeding){window.__seeding=1;B.set('teams/muj',{name:'Tréninkový plán',season:'',size:9,created:Date.now()});return}
  if(j===teamsJson){scheduleRender();return}
  teamsJson=j;D.teams=clone(m);

/* sloučení: pro každý klíč vyhrává novější změna (úprava i smazání) */
function mergeSync(L,R){
  R=R||{data:{},ts:{},tomb:{}};R.data=R.data||{};R.ts=R.ts||{};R.tomb=R.tomb||{};
  var put={},del={},out={data:{},ts:{},tomb:{}},up=false,seen={};
  [L.data,R.data,L.tomb,R.tomb].forEach(function(m){Object.keys(m).forEach(function(k){seen[k]=1})});
  Object.keys(seen).forEach(function(k){
    var lh=k in L.data,rh=k in R.data;
    var lt=lh?(L.ts[k]||0):(L.tomb[k]!==undefined?L.tomb[k]:-1);
    var rt=rh?(R.ts[k]||0):(R.tomb[k]!==undefined?R.tomb[k]:-1);
    if(rt>lt){ /* vyhrává vzdálená */
      if(rh){put[k]={o:R.data[k],t:rt};out.data[k]=R.data[k];out.ts[k]=rt}
      else{del[k]=rt;out.tomb[k]=rt}
    }else{ /* vyhrává místní (i při shodě) */
      if(lh){out.data[k]=L.data[k];out.ts[k]=lt}else if(lt>=0)out.tomb[k]=lt;
      if(lt>rt)up=true;
    }
  });
  return {put:put,del:del,out:out,upload:up};
}

function syncNow(interactive){

  if(SYNC.busy){SYNC.again=true;return SYNC.busy}
  SYNC.err='';status('Synchronizuji…');gsRefresh();
  var wasDirty=lsGet('trenink-gdirty')==='1';lsSet('trenink-gdirty','0');
  SYNC.busy=gToken(!!interactive).then(function(){return gFind()}).then(function(f){
    var lastMod=lsGet('trenink-gmod');
    if(f&&f.modifiedTime===lastMod){
      if(!wasDirty)return f;
      var L0=B.syncState();return gWrite(f.id,L0);
    }
    return (f?gRead(f.id):Promise.resolve(null)).then(function(R){
      var m=mergeSync(B.syncState(),R);
      return B.syncApply(m).then(function(){return (m.upload||!f)?gWrite(f&&f.id,m.out):f});
    });
  }).then(function(f){
    if(f&&f.modifiedTime)lsSet('trenink-gmod',f.modifiedTime);
    SYNC.last=new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});lsSet('trenink-glast',SYNC.last);
    status('Synchronizováno '+SYNC.last);
  }).catch(function(e){
    lsSet('trenink-gdirty','1');SYNC.err=(e&&e.message)||'Synchronizace se nepovedla';status('Synchronizace se nepovedla');
  }).then(function(){

  });

}

    var l=o.l;LIB.push({n:l.name,c:l.cat,s:l.sets,r:l.reps,m:l.min,p:l.rest,d:l.desc||'',video:l.video||'',imgs:l.imgs||[],custom:true,id:o.id});

function mk(i,o){var l=LIB[i];var x={id:uid(),name:l.n,cat:l.c,sets:l.s,reps:l.r,min:l.m,rest:l.p,desc:l.d,note:'',video:l.video||'',imgs:(l.imgs||[]).slice(),done:false,ph:view.phase||1};for(var k in o)x[k]=o[k];return x}
function L(n){for(var i=0;i<LIB.length;i++)if(LIB[i].n===n)return i;return 0}
function generate(){
  var d=ensure(view.sel),err=$('pl-err');
  var foc=(d.focus||[]).filter(function(c){return CAT[c]&&c!=='prot'});
  if(!foc.length){err.textContent='Vyber aspoň jedno zaměření.';return}
  var tgt=Math.min(240,Math.max(15,num($('pl-min').value)||60)),cool=$('pl-cool').checked;
  d.target=tgt;d.cool=cool;
  var budget=Math.max(10,tgt-(cool?8:0)),share=budget/foc.length,picked=[],pools={};
  foc.forEach(function(c){
    var idxs=[];LIB.forEach(function(l,i){if(l.c===c)idxs.push(i)});
    idxs=shuffle(idxs);pools[c]=idxs;
    var used=0,got=[];
    idxs.forEach(function(i){if(used+LIB[i].m<=share+3){got.push(i);used+=LIB[i].m}});
    if(!got.length&&idxs.length)got.push(idxs.slice().sort(function(a,b){return LIB[a].m-LIB[b].m})[0]);
    got.forEach(function(i){picked.push(i)});
  });
  var total=picked.reduce(function(a,i){return a+LIB[i].m},0);
  while(total>budget+4){
    var cnt={};picked.forEach(function(i){cnt[LIB[i].c]=(cnt[LIB[i].c]||0)+1});
    var cand=picked.filter(function(i){return cnt[LIB[i].c]>1}).sort(function(a,b){return LIB[b].m-LIB[a].m})[0];
    if(cand===undefined)break;
    picked.splice(picked.indexOf(cand),1);total-=LIB[cand].m;
  }
  var rest=shuffle(foc.reduce(function(a,c){return a.concat(pools[c])},[])).filter(function(i){return picked.indexOf(i)<0});
  rest.forEach(function(i){if(total+LIB[i].m<=budget+3){picked.push(i);total+=LIB[i].m}});
  if(cool){var pc=[];LIB.forEach(function(l,i){if(l.c==='prot')pc.push(i)});pc=shuffle(pc);if(pc.length)picked.push(pc[0])}
  picked=picked.map(function(i,n){return {i:i,n:n}}).sort(function(a,b){var r=ORDER.indexOf(LIB[a.i].c)-ORDER.indexOf(LIB[b.i].c);return r||a.n-b.n}).map(function(p){return p.i});
  undo={k:view.sel,snap:JSON.stringify(dayOf(view.sel))};
  var ph0=view.phase||1;d.rest=false;d.items=d.items.filter(function(x){return (x.ph||1)!==ph0}).concat(picked.map(function(i){return mk(i)}));
  save();renderAll();
  var pi=phItems(d,ph0);toast('Trénink poskládán: '+pi.length+' cvičení, '+fmtMin(mins({items:pi})),true);
}

function computeStats(){
  var P=plist(),map={},i;
  P.forEach(function(p){map[p.id]={p:p,nom:0,pl:0,g:0,a:0,rs:0,rn:0,tp:0,tt:0,ev:[]}});
  var rec={w:0,d:0,l:0,gf:0,ga:0};
  elist().forEach(function(e){
    if(e.type==='trenink'){
      var at=D.att[e.id];if(!at||!at.st)return;
      P.forEach(function(p){var s=at.st[p.id];if(!s)return;map[p.id].tt++;if(s==='y')map[p.id].tp++});
      return;
    }
    var games=e.type==='zapas'?(e.played&&typeof e.a==='number'&&typeof e.b==='number'?[{a:e.a,b:e.b}]:[]):(e.games||[]).filter(function(g){return typeof g.a==='number'&&typeof g.b==='number'});
    games.forEach(function(g){rec.gf+=g.a;rec.ga+=g.b;if(g.a>g.b)rec.w++;else if(g.a<g.b)rec.l++;else rec.d++});
    (e.nom||[]).forEach(function(pid){

function lineChart(pts,m){
  if(!pts.length)return '';
  var W=360,H=140,L=38,R=22,T=16,Bm=26,vs=pts.map(function(p){return p.v}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);

function seasonOf(d){var y=+d.slice(0,4),m=+d.slice(5,7),a=m>=8?y:y-1;return a+'/'+String((a+1)%100).padStart(2,'0')}
function synHtml(){
  var p=sonP();
  if(!p)return '<section class="panel"><div class="sect"><div class="sect-h"><h2>Statistiky hráče</h2></div><div class="empty"><b>Vyber hráče</b>Přidej hráče na soupisce, případně ho označ hvězdičkou. Jeho statistiky se pak ukážou tady.</div>'+
    '<div class="acts"><button class="btn primary" data-act="newplayer">'+IC.plus+'Přidat hráče</button></div></div></section>';
  var evs=elist(),seasons=[],today=key(new Date());
  evs.forEach(function(e){var k=seasonOf(e.date);if(seasons.indexOf(k)<0)seasons.push(k)});
  seasons.sort().reverse();
  var sf=view.season!=='all'&&seasons.indexOf(view.season)>=0?view.season:'all';
  var rows=[],todo=[],tp=0,tx=0,tn=0,g=0,a=0,rs=0,rn=0;
  evs.forEach(function(e){
    if(sf!=='all'&&seasonOf(e.date)!==sf)return;
    if(e.type==='trenink'){
      var at=D.att[e.id];var st=at&&at.st&&at.st[p.id];
      if(st==='y')tp++;else if(st==='x')tx++;else if(st==='n')tn++;
      return;
    }
    if((e.nom||[]).indexOf(p.id)<0)return;
    if(!e.played){todo.push(e);return}
    var s2=(e.stats||{})[p.id]||{},rt=D.rate[e.id]&&D.rate[e.id].r?D.rate[e.id].r[p.id]:0,nt=D.rate[e.id]&&D.rate[e.id].note?D.rate[e.id].note[p.id]:'';
    g+=s2.g||0;a+=s2.a||0;if(rt){rs+=rt;rn++}
    rows.push({e:e,g:s2.g||0,a:s2.a||0,rt:rt||0,note:nt||''});
  });
  var wd={w:0,d:0,l:0,gf:0,ga:0};rows.forEach(function(r){var e=r.e;if(e.type==='zapas'&&typeof e.a==='number'&&typeof e.b==='number'){wd.gf+=e.a;wd.ga+=e.b;if(e.a>e.b)wd.w++;else if(e.a<e.b)wd.l++;else wd.d++}});
  var n=rows.length,tt=tp+tx+tn,max=1;rows.forEach(function(r){if(r.g+r.a>max)max=r.g+r.a});
  var h='<section class="panel"><div class="sect"><div class="sect-h"><h2>'+esc(p.name)+'</h2><div class="acts"><button class="btn" data-act="editplayer" data-id="'+p.id+'">Upravit</button><button class="btn" data-act="addev" data-t="zapas">'+IC.plus+'Zápas</button><button class="btn" data-act="addev" data-t="turnaj">'+IC.plus+'Turnaj</button></div></div>'+
    '<p class="evt-meta">'+(p.num?'#'+p.num+' · ':'')+(POS[p.pos]||'')+'</p>';
  if(seasons.length>1)h+='<div class="fld" style="max-width:220px"><label for="syn-season">Sezóna</label><select id="syn-season"><option value="all">Všechny</option>'+seasons.map(function(k){return '<option value="'+k+'"'+(sf===k?' selected':'')+'>'+k+'</option>'}).join('')+'</select></div>';
  h+='<div class="rec"><div><b>'+n+'</b><span>odehraných zápasů</span></div><div><b>'+g+'</b><span>góly</span></div><div><b>'+a+'</b><span>asistence</span></div><div><b>'+(g+a)+'</b><span>G + A</span></div></div>'+
    '<div class="rec"><div><b>'+(n?(g/n).toFixed(1).replace('.',','):'–')+'</b><span>gólů na zápas</span></div><div><b>'+(rn?(rs/rn).toFixed(1).replace('.',','):'–')+'</b><span>průměr hodnocení</span></div>'+
    '<div><b>'+(tt?Math.round(tp/tt*100)+' %':'–')+'</b><span>docházka'+(tt?' ('+tp+'/'+tt+')':'')+'</span></div></div>'+
    '<div class="rec"><div><b>'+wd.w+' · '+wd.d+' · '+wd.l+'</b><span>výhry · remízy · prohry</span></div><div><b>'+wd.gf+' : '+wd.ga+'</b><span>skóre týmu</span></div></div></div></section>';
  if(todo.length){
    h+='<section class="panel"><div class="sect"><div class="sect-h"><h2>Čeká na zadání</h2></div><ul class="srows">'+todo.map(function(e){
      var fut=e.date>today;
      return '<li class="srow"><div class="sd">'+esc(fmt(parse(e.date),{day:'numeric',month:'numeric'}))+'</div><div class="sm"><b>'+esc(evTitle(e))+'</b> <small>'+(fut?'nadcházející':'zapiš výsledek')+'</small></div>'+
        (fut?'':'<button class="btn small" data-act="resev" data-id="'+e.id+'">Zapsat</button>')+'</li>';
    }).join('')+'</ul></div></section>';
  }
  h+='<section class="panel"><div class="sect"><div class="sect-h"><h2>Zápasy a turnaje</h2></div>';
  if(!rows.length)h+='<p class="evt-meta">Zatím žádný odehraný zápas. Přidej zápas nebo turnaj, po odehrání v něm zadej výsledek a statistiky.</p>';
  else h+='<ul class="srows">'+rows.slice().reverse().map(function(r){
    var e=r.e,res='';
    if(e.type==='zapas'&&typeof e.a==='number'&&typeof e.b==='number')res=outcome(e.a,e.b)+' '+e.a+':'+e.b;
    else if(e.type==='turnaj'){var w=0,d=0,l=0;(e.games||[]).forEach(function(x){if(typeof x.a!=='number'||typeof x.b!=='number')return;if(x.a>x.b)w++;else if(x.a<x.b)l++;else d++});if(w+d+l)res=w+'V '+d+'R '+l+'P'}
    return '<li class="srow"><div class="sd">'+esc(fmt(parse(e.date),{day:'numeric',month:'numeric'}))+'</div><div class="sm"><b>'+esc(evTitle(e))+'</b>'+(res?' <small>'+esc(res)+'</small>':'')+
      '<div class="sbar" aria-hidden="true"><i style="width:'+Math.round((r.g+r.a)/max*100)+'%"></i></div>'+(r.note?'<div class="hint">'+esc(r.note)+'</div>':'')+'</div>'+
      '<div class="sn"><span><b>'+r.g+'</b> G</span><span><b>'+r.a+'</b> A</span><span><b>'+(r.rt||'–')+'</b>/5</span></div></li>';
  }).join('')+'</ul>';
  return h+'</div></section>';
}
function statHtml(){
  var st=computeStats(),s=view.sort,rows=st.rows.slice();
  var cols=[['num','#'],['name','Hráč'],['nom','Nom.'],['pl','Odehr.'],['g','G'],['a','A'],['ga','G+A']];
  if(ROLE.coach)cols.push(['avg','Ø hod.'],['att','Docházka']);
  function val(r,k){return k==='num'?(r.p.num||999):k==='name'?r.p.name:k==='ga'?r.ga2:k==='avg'?r.avg:k==='att'?r.att:r[k]}
  rows.sort(function(x,y){var a=val(x,s.k),b=val(y,s.k);var c=(typeof a==='string')?a.localeCompare(b,'cs'):a-b;if(!c)c=String(x.p.name).localeCompare(String(y.p.name),'cs');return c*s.d});
  var rec=st.rec,h='<section class="panel"><div class="sect"><div class="sect-h"><h2>Statistiky</h2></div>';
  h+='<div class="rec"><div><b>'+rec.w+' · '+rec.d+' · '+rec.l+'</b><span>výhry · remízy · prohry</span></div><div><b>'+rec.gf+' : '+rec.ga+'</b><span>skóre</span></div></div>';
  if(!rows.length)return h+'<p class="evt-meta">Ve statistikách zatím nejsou žádní hráči.</p></div></section>';
  h+='<div class="tw"><table class="tbl"><thead><tr>'+cols.map(function(c){
    var on=s.k===c[0];return '<th scope="col"'+(on?' aria-sort="'+(s.d>0?'ascending':'descending')+'"':'')+'><button type="button" data-act="sort" data-k="'+c[0]+'">'+c[1]+(on?(s.d>0?' ▲':' ▼'):'')+'</button></th>';
  }).join('')+'</tr></thead><tbody>';
  rows.forEach(function(r){
    var open=!!view.pdet[r.p.id];
    h+='<tr><td>'+(r.p.num||'')+'</td><td class="nm"><button type="button" data-act="pdet" data-id="'+r.p.id+'" aria-expanded="'+open+'">'+esc(r.p.name)+'</button></td><td>'+r.nom+'</td><td>'+r.pl+'</td><td>'+r.g+'</td><td>'+r.a+'</td><td>'+r.ga2+'</td>';
    if(ROLE.coach)h+='<td>'+(r.rn?r.avg.toFixed(1):'–')+'</td><td>'+(r.tt?r.tp+'/'+r.tt+' ('+Math.round(r.att*100)+' %)':'–')+'</td>';
    h+='</tr>';
    if(open){
      h+='<tr class="det"><td colspan="'+cols.length+'">';
      if(!r.ev.length)h+='Zatím žádný odehraný zápas.';
      else{
        h+='<div class="dl"><b>Zápas</b><span></span><b>G</b><b>A</b>'+(ROLE.coach?'<b>Hod.</b>':'<span></span>')+'</div><div class="dl">'+r.ev.map(function(x){
          return '<span>'+esc(fmt(parse(x.e.date),{day:'numeric',month:'numeric'}))+'</span><span>'+esc(evTitle(x.e))+(ROLE.coach&&x.note?' · '+esc(x.note):'')+'</span><span>'+x.g+'</span><span>'+x.a+'</span><span>'+(ROLE.coach?(x.rt||'–'):'')+'</span>';
        }).join('')+'</div>';
      }
      h+='</td></tr>';
    }
  });
  h+='</tbody></table></div>';
  h+='<p class="hint" style="margin-top:10px">Nom. = nominace, Odehr. = odehrané zápasy a turnaje, G = góly, A = asistence.'+(ROLE.coach?' Hodnocení a docházku vidí jen trenér.':'')+'</p>';
  return h+'</div></section>';
}

var lastFocus=null;

function closeModal(){

function toast(t,withUndo){

  el.classList.add('show');clearTimeout(toast.t);

}

  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var max=1000,sc=Math.min(1,max/Math.max(im.width,im.height));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
      var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.75));
    };

  };
  fr.onerror=function(){cb(null)};fr.readAsDataURL(file);
}

var R=null,timer=null,ctx=null;
function beep(){
  if(!sndOn())return;buzz([200,100,200]);
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach(function(t){
      var o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;o.connect(g);g.connect(ctx.destination);
      g.gain.setValueAtTime(.2,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.18);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.2);
    });
  }catch(e){}
}
